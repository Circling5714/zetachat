[workspace]
resolver = "2"
members = ["crates/zeta-zalo", "crates/zeta-gateway"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Circling5714/zetachat"

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
cbc = "0.1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = "symbols"
lto = "thin"
