[package]
name = "zeta-gateway"
description = "zetachat gateway: keeps one Zalo session and serves your own devices over LAN/VPN"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "zetachat-gateway"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
qrcode = { workspace = true, features = ["svg"] }
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "signal"] }
tower.workspace = true
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeta-zalo = { path = "../zeta-zalo" }
