<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>zetachat</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="pair" class="screen" hidden>
    <form id="pair-form" class="card pair-card">
      <img src="/icon.svg" alt="" class="pair-logo" width="56" height="56">
      <h1>zetachat</h1>
      <p class="muted">Nhập token của thiết bị này. Token được tạo trên máy chủ bằng lệnh <code>zetachat-gateway device add &lt;tên&gt;</code>.</p>
      <input id="pair-token" class="field" placeholder="zc_…" autocomplete="off" spellcheck="false" required>
      <button type="submit" class="btn">Kết nối</button>
      <p id="pair-error" class="error" hidden></p>
    </form>
  </div>

  <div id="app" class="layout" hidden>
    <aside class="sidebar">
      <header class="side-head">
        <div class="who">
          <div id="me-avatar" class="avatar me-avatar"></div>
          <span class="brand">zetachat</span>
        </div>
        <button id="zalo-status" class="status-pill" type="button"></button>
      </header>
      <div class="search-wrap">
        <input id="search" class="field" type="search" placeholder="Tìm bạn bè, nhóm, tin nhắn" autocomplete="off">
        <button id="add-friend-btn" class="attach-btn" type="button" title="Thêm bạn bằng số điện thoại" aria-label="Thêm bạn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 8v6M16 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-filter="all" type="button">Tất cả</button>
        <button class="tab" data-filter="unread" type="button">Chưa đọc</button>
        <button class="tab" data-filter="friends" type="button">Bạn bè<span id="requests-badge" class="badge tab-badge" hidden></span></button>
        <button class="tab" data-filter="groups" type="button">Nhóm</button>
      </div>
      <ul id="threads" class="threads"></ul>
    </aside>

    <main class="chat">
      <div id="empty" class="empty">
        <img src="/icon.svg" alt="" width="64" height="64">
        <p>Chọn một hội thoại để bắt đầu</p>
      </div>
      <section id="conversation" class="conversation" hidden>
        <header class="chat-head">
          <button id="back" class="icon-btn" type="button" aria-label="Quay lại">‹</button>
          <div id="chat-avatar" class="avatar"></div>
          <div class="chat-title">
            <div id="chat-name" class="name"></div>
            <div id="chat-sub" class="muted small"></div>
          </div>
          <button id="info-toggle" class="head-btn" type="button" title="Thông tin hội thoại" aria-label="Thông tin hội thoại">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.3" fill="currentColor"/></svg>
          </button>
        </header>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="uploads" class="uploads" role="status" aria-live="polite" hidden></div>
        <div id="reply-bar" class="reply-bar" hidden>
          <div class="reply-info">
            <div id="reply-name" class="reply-name"></div>
            <div id="reply-text" class="reply-text"></div>
          </div>
          <button id="reply-cancel" class="upload-cancel" type="button" title="Hủy trả lời" aria-label="Hủy trả lời">×</button>
        </div>
        <div id="panel" class="panel" hidden></div>
        <form id="composer" class="composer">
          <button id="open-stickers" class="attach-btn" type="button" title="Nhãn dán" aria-label="Nhãn dán">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20.5 13.5V6.5a3 3 0 0 0-3-3h-11a3 3 0 0 0-3 3v11a3 3 0 0 0 3 3h7l7-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 20.5v-4a3 3 0 0 1 3-3h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="15" cy="10" r="1.3" fill="currentColor"/><path d="M8.5 14.5c1 1 2.2 1.5 3.5 1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button id="attach-photo" class="attach-btn" type="button" title="Gửi ảnh (có thể dán hoặc kéo thả)" aria-label="Gửi ảnh">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="9.5" r="1.8" fill="currentColor"/><path d="M4 18l5.2-5.2a1.5 1.5 0 0 1 2.1 0L15 16.5M13.5 15l2.2-2.2a1.5 1.5 0 0 1 2.1 0L21 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="attach" class="attach-btn" type="button" title="Đính kèm tệp, tối đa 1 GB (có thể kéo thả)" aria-label="Đính kèm tệp">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8.5 12.5l6.4-6.4a3 3 0 0 1 4.2 4.2l-8.1 8.1a5 5 0 0 1-7.1-7.1L11.6 3.6M10.6 15.2l6.3-6.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input id="photo-input" type="file" accept="image/*" multiple hidden>
          <input id="file-input" type="file" multiple hidden>
          <div class="input-wrap">
            <textarea id="input" rows="1" placeholder="Nhập tin nhắn…" aria-label="Tin nhắn"></textarea>
            <button id="open-emoji" class="emoji-btn" type="button" title="Biểu tượng cảm xúc" aria-label="Biểu tượng cảm xúc">
              <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="15" cy="10" r="1.3" fill="currentColor"/><path d="M8 14.2c1 1.5 2.4 2.3 4 2.3s3-.8 4-2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <button id="send" class="btn like" type="submit" title="Gửi 👍">👍</button>
        </form>
      </section>
    </main>
    <aside id="info" class="info" aria-label="Thông tin hội thoại" hidden></aside>
  </div>

  <div id="login" class="modal" hidden>
    <div class="card login-card" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <h2 id="login-title">Đăng nhập Zalo</h2>
      <p id="login-text" class="muted"></p>
      <img id="login-qr" class="qr" alt="Mã QR đăng nhập Zalo" hidden>
      <div class="row">
        <button id="login-start" class="btn" type="button">Tạo mã QR</button>
        <button id="login-close" class="btn secondary" type="button">Đóng</button>
      </div>
    </div>
  </div>

  <div id="add-friend" class="modal" hidden>
    <div class="card add-card" role="dialog" aria-modal="true" aria-labelledby="add-title">
      <h2 id="add-title">Thêm bạn</h2>
      <form id="find-form" class="find-row">
        <input id="find-phone" class="field" type="tel" inputmode="tel" placeholder="Số điện thoại" autocomplete="off" required>
        <button class="btn" type="submit">Tìm</button>
      </form>
      <div id="find-result" class="find-result"></div>
      <div class="row">
        <button id="add-close" class="btn secondary" type="button">Đóng</button>
      </div>
    </div>
  </div>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Xem ảnh" hidden>
    <div id="viewer-stage" class="viewer-stage">
      <img id="viewer-img" alt="">
    </div>
    <div class="row">
      <a id="viewer-save" class="btn secondary" download>Tải về</a>
      <button id="viewer-close" class="btn secondary" type="button">Đóng</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
